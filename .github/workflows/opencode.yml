name: OpenCode

on:
  # Run when a new issue contains an OpenCode command
  issues:
    types: [opened]

  # Run commands posted in issue or PR comments
  issue_comment:
    types: [created]

  # Run commands posted on inline PR review comments
  pull_request_review_comment:
    types: [created]

  # Automatically review new or updated PRs
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # 1. Implement tasks from new issues
  issue-task:
    if: |
      (
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR'
      ) &&
      (
        contains(github.event.issue.body, '/opencode') ||
        contains(github.event.issue.body, '/oc')
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode from issue
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/mimo-v2.6-flash-free
          use_github_token: true
          prompt: |
            Implement the task described in this GitHub issue.

            Issue title:
            ${{ github.event.issue.title }}

            Issue description:
            ${{ github.event.issue.body }}

            Instructions:
              - Inspect the repository and understand its architecture.
              - Create a dedicated branch for this task.
              - Implement the requested changes.
              - Add or update tests as appropriate.
              - Run relevant tests and checks.
              - Commit the completed changes.
              - Push the branch to GitHub.
              - Open a pull request targeting the repository's default branch.
              - Assign the pull request to ${{ github.event.issue.user.login }}.
              - Reference the original issue in the pull request.
              - If the pull request already exists for this task, update its branch
                rather than creating duplicate pull requests.
              - Never push directly to the default branch.
              - Never merge the pull request.

  # 2. Handle commands from trusted collaborators
  comment-task:
    if: |
      (
        (
          github.event_name == 'issue_comment' &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        )
      ) &&
      (
        contains(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, '/oc')
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode from comment
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/mimo-v2.6-flash-free
          use_github_token: true

  # 3. Automatically review PRs
  review-pr:
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode PR review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/mimo-v2.6-flash-free
          use_github_token: true
          prompt: |
            Review this pull request thoroughly.

            Check for:
            - Bugs and incorrect behavior
            - Security vulnerabilities
            - Regressions and edge cases
            - Missing or inadequate tests
            - Error handling problems
            - Performance and maintainability issues

            Instructions:
            - Review the changes against the base branch.
            - Report actionable findings with file and line references.
            - Prioritize important bugs over stylistic suggestions.
            - Submit a review or review comments when appropriate.
            - Do not modify files or push commits.
            - Do not merge the pull request.    
      # - name: Run OpenCode
      #   uses: anomalyco/opencode/github@latest
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #   with:
      #     model: openai/REPLACE_WITH_YOUR_MODEL
